<!doctype html>
<!-- Synthetic GitHub README shape for nested Markdown-list ownership regression. -->
<html lang="en">
<head><meta charset="utf-8"><title>README fixture</title></head>
<body>
    <main>
        <article class="markdown-body">
            <div class="markdown-heading">
                <h2 data-testid="features-heading">Features</h2>
            </div>
            <ul>
                <li data-testid="customization-item">
                    <p data-testid="customization-label">Customization</p>
                    <ul data-testid="customization-features">
                        <li data-testid="shortcut-item">Function shortcuts (single press, long press or multiple presses to trigger actions)</li>
                        <li data-testid="selection-popup-item">Selection translate popup (interface customization)</li>
                        <li data-testid="extension-popup-item">Extension popup (UI customization)</li>
                    </ul>
                </li>
            </ul>
        </article>
    </main>
</body>
</html>
